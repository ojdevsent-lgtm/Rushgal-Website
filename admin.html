<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Rushgal Admin</title><link rel="stylesheet" href="admin.css"></head><body>
<main class="admin-shell">
<header class="admin-header"><div><p class="kicker">RUSHGAL / ADMIN</p><h1>Store overview</h1></div><button class="ghost" id="logout">Sign out</button></header>
<section class="metrics"><article><span>Today's sales</span><strong>₦0</strong></article><article><span>New orders</span><strong>0</strong></article><article><span>Products</span><strong id="productCount">0</strong></article><article><span>Low stock</span><strong>0</strong></article></section>
<section class="dashboard-grid"><article class="panel wide"><div class="panel-head"><h2>Products</h2><button class="primary" id="addProduct">Add product</button></div><div id="productManager" class="product-manager"><div class="empty">Loading products…</div></div></article>
<article class="panel"><div class="panel-head"><h2>Quick actions</h2></div><div class="actions"><button id="addProduct2">Add product</button><button>Manage delivery</button><button>Edit homepage</button></div></article>
<article class="panel"><div class="panel-head"><h2>Store status</h2></div><p class="status"><i></i> Online</p><p class="muted">Product changes are stored in Firebase and can flow directly to the storefront.</p></article></section>
</main>
<div class="modal" id="productModal"><div class="modal-card"><div class="panel-head"><h2>Product editor</h2><button class="ghost" id="closeProduct">Close</button></div><form id="productForm"><label>Name<input name="name" required></label><label>Category<input name="category" required></label><div class="form-row"><label>Price<input name="price" type="number" min="0" required></label><label>Stock<input name="stock" type="number" min="0" required></label></div><label>Status<select name="status"><option value="active">Available</option><option value="out_of_stock">Out of stock</option><option value="draft">Draft</option></select></label><label>Description<textarea name="description" rows="4"></textarea></label><label>Product image<input name="image" type="file" accept="image/*"></label><img id="productImagePreview" class="preview" alt=""><button class="primary" type="submit">Save product</button></form></div></div>
<script type="module" src="admin-products.js"></script><script src="admin.js"></script></body></html>
