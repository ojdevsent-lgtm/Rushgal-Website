<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Rushgal Admin</title><link rel="stylesheet" href="admin.css"></head><body>
<main class="admin-shell">
  <header class="admin-header"><div><p class="kicker">RUSHGAL / ADMIN</p><h1>Store overview</h1></div><button class="ghost" id="logout">Sign out</button></header>
  <section class="metrics"><article><span>Today's sales</span><strong>₦0</strong></article><article><span>New orders</span><strong>0</strong></article><article><span>Products</span><strong>0</strong></article><article><span>Low stock</span><strong>0</strong></article></section>
  <section class="dashboard-grid">
    <article class="panel wide"><div class="panel-head"><h2>Recent orders</h2><button class="ghost">View all</button></div><div class="empty">Orders will appear here when customers begin checking out.</div></article>
    <article class="panel"><div class="panel-head"><h2>Quick actions</h2></div><div class="actions"><button>Add product</button><button>Manage delivery</button><button>Edit homepage</button></div></article>
    <article class="panel"><div class="panel-head"><h2>Store status</h2></div><p class="status"><i></i> Online</p><p class="muted">Customer storefront is ready to accept orders once Firebase is connected.</p></article>
  </section>
</main><script src="admin.js"></script></body></html>
